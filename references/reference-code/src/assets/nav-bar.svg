<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 82" width="390" height="82">
  <defs>
    <!-- Nav background gradient -->
    <linearGradient id="nav-bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#100d28"/>
      <stop offset="100%" stop-color="#07040f"/>
    </linearGradient>
    <!-- Arch gold stroke gradient -->
    <linearGradient id="arch-gold" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#3d2060" stop-opacity="0.15"/>
      <stop offset="38%"  stop-color="#d4a017" stop-opacity="0.65"/>
      <stop offset="50%"  stop-color="#ffd700" stop-opacity="1"/>
      <stop offset="62%"  stop-color="#d4a017" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3d2060" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Divider gold gradient -->
    <linearGradient id="div-g2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#3d2060" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#d4a017" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#d4a017" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3d2060" stop-opacity="0"/>
    </linearGradient>
    <!-- Nav item gem gold -->
    <linearGradient id="gem-gold-battle" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#9a6400"/>
    </linearGradient>
    <linearGradient id="gem-gold-active" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#9a6400"/>
    </linearGradient>
  </defs>

  <!-- ── Ornamental divider (10px) ── -->
  <line x1="0" y1="5" x2="390" y2="5" stroke="url(#div-g2)" stroke-width="1"/>
  <!-- 5 diamonds for 5 nav items -->
  <polygon points="39,2 42.5,5 39,8 35.5,5"  fill="#7b2ff7" opacity="0.5"/>
  <polygon points="117,2 120.5,5 117,8 113.5,5" fill="#7b2ff7" opacity="0.5"/>
  <polygon points="195,2 198.5,5 195,8 191.5,5" fill="#ffd700" opacity="0.95"/>
  <polygon points="273,2 276.5,5 273,8 269.5,5" fill="#7b2ff7" opacity="0.5"/>
  <polygon points="351,2 354.5,5 351,8 347.5,5" fill="#7b2ff7" opacity="0.5"/>

  <!-- ── Nav bar background with arch ── -->
  <!-- Arch shape: rises at center for Battle -->
  <path d="M 0 32 Q 90 32 145 22 Q 168 16 195 13 Q 222 16 245 22 Q 300 32 390 32 L 390 82 L 0 82 Z"
    fill="url(#nav-bg)"/>
  <!-- Arch gold edge -->
  <path d="M 0 32 Q 90 32 145 22 Q 168 16 195 13 Q 222 16 245 22 Q 300 32 390 32"
    fill="none" stroke="url(#arch-gold)" stroke-width="1.2"/>

  <!-- Subtle vertical dividers between items -->
  <line x1="78"  y1="32" x2="78"  y2="78" stroke="#2a1845" stroke-width="0.5" opacity="0.4"/>
  <line x1="156" y1="32" x2="156" y2="78" stroke="#2a1845" stroke-width="0.5" opacity="0.4"/>
  <line x1="234" y1="32" x2="234" y2="78" stroke="#2a1845" stroke-width="0.5" opacity="0.4"/>
  <line x1="312" y1="32" x2="312" y2="78" stroke="#2a1845" stroke-width="0.5" opacity="0.4"/>

  <!-- ── Active top glow line (Battle = active) ── -->
  <rect x="156" y="10" width="78" height="1" fill="none"/>
  <line x1="156" y1="10" x2="234" y2="10" stroke="#00e5c8" stroke-width="1" opacity="0.7"/>

  <!-- ── HOME (x=0–78, inactive) ── -->
  <g transform="translate(24,46)">
    <!-- House icon -->
    <polyline points="15,14 15,22 21,22 21,18 27,18 27,22 33,22 33,14" fill="none" stroke="#4a3068" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="11,16 24,8 37,16" fill="none" stroke="#4a3068" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="39" y="76" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#3a2858" letter-spacing="0.08em">HOME</text>

  <!-- ── HEROES (x=78–156, inactive) ── -->
  <g transform="translate(102,47)">
    <!-- People icon (simplified) -->
    <circle cx="9"  cy="13" r="4" fill="none" stroke="#4a3068" stroke-width="1.4"/>
    <circle cx="21" cy="13" r="4" fill="none" stroke="#4a3068" stroke-width="1.4"/>
    <path d="M1 24 Q5 19 9 19 Q13 19 17 24" fill="none" stroke="#4a3068" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M13 24 Q17 19 21 19 Q25 19 29 24" fill="none" stroke="#4a3068" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="117" y="76" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#3a2858" letter-spacing="0.08em">HEROES</text>

  <!-- ── BATTLE (x=156–234, ACTIVE + raised) ── -->
  <!-- Octagonal gem frame for active Battle (raised on the arch) -->
  <polygon points="176,13 214,13 224,23 224,47 214,57 176,57 166,47 166,23"
    fill="#0d1830" stroke="url(#gem-gold-battle)" stroke-width="1.5"/>
  <!-- Inner ring -->
  <polygon points="180,17 210,17 220,27 220,43 210,53 180,53 170,43 170,27"
    fill="none" stroke="#00e5c8" stroke-width="0.7" opacity="0.6"/>
  <!-- Active glow top line -->
  <line x1="176" y1="10" x2="214" y2="10" stroke="#00e5c8" stroke-width="0.8" opacity="0.6"/>
  <!-- Crossed swords icon -->
  <g transform="translate(195,35)">
    <line x1="-9" y1="-9" x2="9"  y2="9"  stroke="#00e5c8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="9"  y1="-9" x2="-9" y2="9"  stroke="#00e5c8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-11" y1="-7" x2="-9" y2="-9" stroke="#00e5c8" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="11" y1="-7" x2="9"  y2="-9" stroke="#00e5c8" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-11" y1="7" x2="-9"  y2="9"  stroke="#00e5c8" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="11"  y1="7" x2="9"   y2="9"  stroke="#00e5c8" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="195" y="65" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="8" fill="#a0f8e8" letter-spacing="0.08em">BATTLE</text>

  <!-- ── GUILD (x=234–312, inactive) ── -->
  <g transform="translate(258,47)">
    <!-- Shield icon -->
    <path d="M15 8 L22 11 L22 18 Q22 23 15 26 Q8 23 8 18 L8 11 Z"
      fill="none" stroke="#4a3068" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <text x="273" y="76" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#3a2858" letter-spacing="0.08em">GUILD</text>

  <!-- ── SHOP (x=312–390, inactive) ── -->
  <g transform="translate(336,47)">
    <!-- Bag icon -->
    <rect x="5" y="13" width="20" height="15" rx="2" fill="none" stroke="#4a3068" stroke-width="1.4"/>
    <path d="M10 13 L10 10 Q15 6 20 10 L20 13" fill="none" stroke="#4a3068" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="351" y="76" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#3a2858" letter-spacing="0.08em">SHOP</text>

</svg>
