<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 74" width="390" height="74">
  <defs>
    <!-- Background -->
    <linearGradient id="bar-bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0e0a28"/>
      <stop offset="100%" stop-color="#060210"/>
    </linearGradient>
    <!-- Gold divider -->
    <linearGradient id="div-g" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#3d2060" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#d4a017" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#ffd700" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#d4a017" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3d2060" stop-opacity="0"/>
    </linearGradient>
    <!-- Auto button gold border -->
    <linearGradient id="auto-gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="50%"  stop-color="#8b6200"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <!-- Auto button bg (active = green tint) -->
    <linearGradient id="auto-bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0d2e1a"/>
      <stop offset="100%" stop-color="#071510"/>
    </linearGradient>
    <!-- Skill button gold border (active) -->
    <linearGradient id="sk-gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="45%"  stop-color="#9a6400"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <!-- Skill button gold border (locked) -->
    <linearGradient id="sk-gold-locked" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#3a2450"/>
      <stop offset="45%"  stop-color="#1e1030"/>
      <stop offset="100%" stop-color="#3a2450"/>
    </linearGradient>
    <!-- Skill button bg (active) -->
    <linearGradient id="sk-bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#18204a"/>
      <stop offset="100%" stop-color="#0d1535"/>
    </linearGradient>
    <!-- Skill button bg (locked) -->
    <linearGradient id="sk-bg-locked" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#110820"/>
      <stop offset="100%" stop-color="#0a0515"/>
    </linearGradient>
    <!-- Shine overlay -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── Ornamental top divider (10px) ── -->
  <line x1="0" y1="5" x2="390" y2="5" stroke="url(#div-g)" stroke-width="1"/>
  <!-- 3 diamonds: left, center, right -->
  <polygon points="100,2 103.5,5 100,8 96.5,5"  fill="#7b2ff7" opacity="0.5"/>
  <polygon points="195,2 198.5,5 195,8 191.5,5" fill="#ffd700" opacity="0.95"/>
  <polygon points="290,2 293.5,5 290,8 286.5,5" fill="#7b2ff7" opacity="0.5"/>

  <!-- ── Bar background (y=10, h=64) ── -->
  <rect x="0" y="10" width="390" height="64" fill="url(#bar-bg)"/>

  <!-- ── AUTO BUTTON (x=8, y=12, 44×50) — ACTIVE state ── -->
  <polygon points="18,12 42,12 51,22 51,50 42,59 18,59 9,50 9,22"
    fill="url(#auto-bg)" stroke="url(#auto-gold)" stroke-width="1.5"/>
  <!-- Inner ring -->
  <polygon points="22,16 38,16 47,26 47,46 38,56 22,56 13,46 13,26"
    fill="none" stroke="#00e580" stroke-width="0.7" opacity="0.55"/>
  <!-- Shimmer -->
  <line x1="20" y1="18" x2="26" y2="24" stroke="#fff" stroke-width="0.7" opacity="0.2" stroke-linecap="round"/>
  <!-- Auto icon: circular arrow -->
  <path d="M30 30 A6 6 0 1 1 24 36" fill="none" stroke="#00e580" stroke-width="1.4" stroke-linecap="round"/>
  <polygon points="24,32 24,37 29,37" fill="#00e580"/>
  <!-- AUTO label -->
  <text x="30" y="52" text-anchor="middle" font-family="serif" font-weight="700" font-size="7.5" fill="#00e580" letter-spacing="0.04em">AUTO</text>

  <!-- ── Vertical separator ── -->
  <line x1="59" y1="22" x2="59" y2="58" stroke="#3d2060" stroke-width="1" opacity="0.7"/>

  <!-- Helper macro: skill button at cx,cy — reused 6 times below -->
  <!-- Positions:
    Btn1 center=(91,35)  active
    Btn2 center=(144,35) active
    Btn3 center=(197,35) active
    Btn4 center=(250,35) locked  Lv.40
    Btn5 center=(303,35) locked  Lv.55
    Btn6 center=(356,35) locked  Lv.70
  -->

  <!-- ── Skill Button 1 (Fire Rune) — cx=91 ── -->
  <g transform="translate(66,10)">
    <polygon points="13,1 37,1 49,13 49,37 37,49 13,49 1,37 1,13"
      fill="url(#sk-bg)" stroke="url(#sk-gold)" stroke-width="1.5"/>
    <polygon points="13,1 37,1 49,13 49,37 37,49 13,49 1,37 1,13" fill="url(#shine)"/>
    <polygon points="16,5 34,5 45,16 45,34 34,45 16,45 5,34 5,16"
      fill="none" stroke="#00e5c8" stroke-width="0.8" opacity="0.45"/>
    <circle cx="13" cy="13" r="2.2" fill="#ffd700" opacity="0.9"/>
    <circle cx="37" cy="13" r="2.2" fill="#ffd700" opacity="0.9"/>
    <circle cx="37" cy="37" r="2.2" fill="#ffd700" opacity="0.9"/>
    <circle cx="13" cy="37" r="2.2" fill="#ffd700" opacity="0.9"/>
    <line x1="13" y1="8" x2="20" y2="15" stroke="#fff" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>
    <!-- Fire rune icon -->
    <path d="M25 8 C25 8 30 14 28.5 19.5 C27.5 23 23 24 21.5 20.5 C20.5 18 22.5 16 24 18 C24.8 19.2 24 21 22.5 21"
      stroke="#ff7733" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="22" r="2" fill="#ff7733" opacity="0.45"/>
  </g>

  <!-- ── Skill Button 2 (Ice Rune) — cx=144 ── -->
  <g transform="translate(119,10)">
    <polygon points="13,1 37,1 49,13 49,37 37,49 13,49 1,37 1,13"
      fill="url(#sk-bg)" stroke="url(#sk-gold)" stroke-width="1.5"/>
    <polygon points="13,1 37,1 49,13 49,37 37,49 13,49 1,37 1,13" fill="url(#shine)"/>
    <polygon points="16,5 34,5 45,16 45,34 34,45 16,45 5,34 5,16"
      fill="none" stroke="#00e5c8" stroke-width="0.8" opacity="0.45"/>
    <circle cx="13" cy="13" r="2.2" fill="#ffd700" opacity="0.9"/>
    <circle cx="37" cy="13" r="2.2" fill="#ffd700" opacity="0.9"/>
    <circle cx="37" cy="37" r="2.2" fill="#ffd700" opacity="0.9"/>
    <circle cx="13" cy="37" r="2.2" fill="#ffd700" opacity="0.9"/>
    <line x1="13" y1="8" x2="20" y2="15" stroke="#fff" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>
    <!-- Ice rune icon -->
    <line x1="25" y1="10" x2="25" y2="38" stroke="#66ddff" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="11" y1="24" x2="39" y2="24" stroke="#66ddff" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="14.4" y1="13.4" x2="35.6" y2="34.6" stroke="#66ddff" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="35.6" y1="13.4" x2="14.4" y2="34.6" stroke="#66ddff" stroke-width="1.2" stroke-linecap="round"/>
    <polygon points="25,11.5 26.2,13.8 25,13.2 23.8,13.8" fill="#aaeeff"/>
    <polygon points="25,36.5 26.2,34.2 25,34.8 23.8,34.2" fill="#aaeeff"/>
    <circle cx="25" cy="24" r="2.2" fill="#66ddff" opacity="0.2" stroke="#aaeeff" stroke-width="0.7"/>
  </g>

  <!-- ── Skill Button 3 (Wind Rune) — cx=197 ── -->
  <g transform="translate(172,10)">
    <polygon points="13,1 37,1 49,13 49,37 37,49 13,49 1,37 1,13"
      fill="url(#sk-bg)" stroke="url(#sk-gold)" stroke-width="1.5"/>
    <polygon points="13,1 37,1 49,13 49,37 37,49 13,49 1,37 1,13" fill="url(#shine)"/>
    <polygon points="16,5 34,5 45,16 45,34 34,45 16,45 5,34 5,16"
      fill="none" stroke="#00e5c8" stroke-width="0.8" opacity="0.45"/>
    <circle cx="13" cy="13" r="2.2" fill="#ffd700" opacity="0.9"/>
    <circle cx="37" cy="13" r="2.2" fill="#ffd700" opacity="0.9"/>
    <circle cx="37" cy="37" r="2.2" fill="#ffd700" opacity="0.9"/>
    <circle cx="13" cy="37" r="2.2" fill="#ffd700" opacity="0.9"/>
    <line x1="13" y1="8" x2="20" y2="15" stroke="#fff" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>
    <!-- Wind rune icon -->
    <path d="M12 18 Q18 16 22 18 Q26 20 28 18 Q29 17 28.5 16" stroke="#aaddcc" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M11 24 Q17 22 21 24 Q25 26 27 24" stroke="#88ccbb" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M12 30 Q16 28 19 30 Q22 32 24 30 Q25 29 24.5 28" stroke="#aaddcc" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <circle cx="28.5" cy="16" r="1.2" fill="#aaddcc" opacity="0.7"/>
    <circle cx="24.5" cy="28" r="1.2" fill="#aaddcc" opacity="0.7"/>
  </g>

  <!-- ── Skill Button 4 (Shadow — LOCKED Lv.40) — cx=250 ── -->
  <g transform="translate(225,10)">
    <polygon points="13,1 37,1 49,13 49,37 37,49 13,49 1,37 1,13"
      fill="url(#sk-bg-locked)" stroke="url(#sk-gold-locked)" stroke-width="1.5"/>
    <polygon points="16,5 34,5 45,16 45,34 34,45 16,45 5,34 5,16"
      fill="none" stroke="#2a1845" stroke-width="0.8" opacity="0.2"/>
    <circle cx="13" cy="13" r="2.2" fill="#2a1845" opacity="0.2"/>
    <circle cx="37" cy="13" r="2.2" fill="#2a1845" opacity="0.2"/>
    <circle cx="37" cy="37" r="2.2" fill="#2a1845" opacity="0.2"/>
    <circle cx="13" cy="37" r="2.2" fill="#2a1845" opacity="0.2"/>
    <line x1="18" y1="18" x2="32" y2="32" stroke="#2a1845" stroke-width="0.5" opacity="0.5"/>
    <line x1="32" y1="18" x2="18" y2="32" stroke="#2a1845" stroke-width="0.5" opacity="0.5"/>
    <!-- Lock icon -->
    <rect x="20" y="22" width="10" height="8" rx="1.5" fill="none" stroke="#3a2455" stroke-width="1.2"/>
    <path d="M22 22 L22 19 Q25 16 28 19 L28 22" fill="none" stroke="#3a2455" stroke-width="1.2" stroke-linecap="round"/>
    <text x="25" y="39" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="6.5" fill="#3a2455">Lv.40</text>
  </g>

  <!-- ── Skill Button 5 (LOCKED Lv.55) — cx=303 ── -->
  <g transform="translate(278,10)">
    <polygon points="13,1 37,1 49,13 49,37 37,49 13,49 1,37 1,13"
      fill="url(#sk-bg-locked)" stroke="url(#sk-gold-locked)" stroke-width="1.5"/>
    <polygon points="16,5 34,5 45,16 45,34 34,45 16,45 5,34 5,16"
      fill="none" stroke="#2a1845" stroke-width="0.8" opacity="0.2"/>
    <circle cx="13" cy="13" r="2.2" fill="#2a1845" opacity="0.2"/>
    <circle cx="37" cy="13" r="2.2" fill="#2a1845" opacity="0.2"/>
    <circle cx="37" cy="37" r="2.2" fill="#2a1845" opacity="0.2"/>
    <circle cx="13" cy="37" r="2.2" fill="#2a1845" opacity="0.2"/>
    <line x1="18" y1="18" x2="32" y2="32" stroke="#2a1845" stroke-width="0.5" opacity="0.5"/>
    <line x1="32" y1="18" x2="18" y2="32" stroke="#2a1845" stroke-width="0.5" opacity="0.5"/>
    <rect x="20" y="22" width="10" height="8" rx="1.5" fill="none" stroke="#3a2455" stroke-width="1.2"/>
    <path d="M22 22 L22 19 Q25 16 28 19 L28 22" fill="none" stroke="#3a2455" stroke-width="1.2" stroke-linecap="round"/>
    <text x="25" y="39" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="6.5" fill="#3a2455">Lv.55</text>
  </g>

  <!-- ── Skill Button 6 (LOCKED Lv.70) — cx=356 ── -->
  <g transform="translate(331,10)">
    <polygon points="13,1 37,1 49,13 49,37 37,49 13,49 1,37 1,13"
      fill="url(#sk-bg-locked)" stroke="url(#sk-gold-locked)" stroke-width="1.5"/>
    <polygon points="16,5 34,5 45,16 45,34 34,45 16,45 5,34 5,16"
      fill="none" stroke="#2a1845" stroke-width="0.8" opacity="0.2"/>
    <circle cx="13" cy="13" r="2.2" fill="#2a1845" opacity="0.2"/>
    <circle cx="37" cy="13" r="2.2" fill="#2a1845" opacity="0.2"/>
    <circle cx="37" cy="37" r="2.2" fill="#2a1845" opacity="0.2"/>
    <circle cx="13" cy="37" r="2.2" fill="#2a1845" opacity="0.2"/>
    <line x1="18" y1="18" x2="32" y2="32" stroke="#2a1845" stroke-width="0.5" opacity="0.5"/>
    <line x1="32" y1="18" x2="18" y2="32" stroke="#2a1845" stroke-width="0.5" opacity="0.5"/>
    <rect x="20" y="22" width="10" height="8" rx="1.5" fill="none" stroke="#3a2455" stroke-width="1.2"/>
    <path d="M22 22 L22 19 Q25 16 28 19 L28 22" fill="none" stroke="#3a2455" stroke-width="1.2" stroke-linecap="round"/>
    <text x="25" y="39" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="6.5" fill="#3a2455">Lv.70</text>
  </g>

</svg>
